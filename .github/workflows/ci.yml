# .github/workflows/ci.yml

name: Continuous Integration

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/**" # Still include workflow changes
      - ".vscode/**"
  # No path filter: the required "CI result" check must report on every pull request.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Pull requests cancel superseded runs; every push to main and every tag publishes its image.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: "pip"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - run: make install

      - run: make fmt-check

      - run: make lint

      - run: make lint-md

  test:
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - run: make install

      - name: Run tests
        run: make test-ci

      - name: Run performance tests
        run: make test-performance
        if: matrix.python-version == '3.14'

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.python-version == '3.14'
        with:
          files: ./coverage.xml

  docker-test:
    name: Dockerfile Testing Target
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - run: docker build --target testing .

  image:
    name: Image
    needs: [quality, test, docker-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # `latest` is the newest release from main (the action's default, `latest: release`).
      - uses: lipkau/gh-tools/actions/container-image@e3ed36df3d68c66d7ebf27f5ab0d3b0a7cf45af3 # container-image/v1.0.0

  # The only check the main branch ruleset requires, so the matrix can change freely.
  # Add every new job to `needs`.
  ci-result:
    name: CI result
    if: always()
    needs: [quality, test, docker-test, image]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
