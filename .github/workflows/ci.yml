# .github/workflows/ci.yml

name: Continuous Integration

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/**" # Still include workflow changes
      - ".vscode/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/**" # Still include workflow changes
      - ".vscode/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: make install

      - run: make fmt-check

      - run: make lint

      - run: make lint-md

  test:
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - run: make install

      - name: Run tests
        run: make test-ci

      - name: Run performance tests
        run: make test-performance
        if: matrix.python-version == '3.14'

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        if: matrix.python-version == '3.14'
        with:
          files: ./coverage.xml

  docker-test:
    name: Dockerfile Testing Target
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - run: docker build --target testing .
